<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İki Yıldız Erkek Kuaförü</title>
<meta name="description" content="İki Yıldız Erkek Kuaförü - online randevu, hizmetler ve iletişim">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#111;--card:#1b1b1b;--line:#2c2c2c;--gold:#d4a437;--text:#f2f2f2;--mute:#9a9a9a;--ok:#3ecf6e;--bad:#e5534b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
h1,h2{margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hero{position:relative;height:260px;background:linear-gradient(160deg,#2a2210,#111);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 16px;background:linear-gradient(transparent,#111 90%)}
.stars{color:var(--gold);font-size:22px;letter-spacing:4px}
.hero h1{font-size:32px;margin:4px 0}
.hero p{margin:0;color:var(--mute)}
.badge{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600}
.badge.open{background:#143b22;color:var(--ok)}.badge.closed{background:#3b1816;color:var(--bad)}
section{display:none;padding-top:18px}
section.active{display:block}
h2{font-size:20px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{color:var(--gold);font-weight:700;white-space:nowrap}
.mute{color:var(--mute);font-size:14px;line-height:1.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;background:var(--gold);color:#111;width:100%;font-family:inherit}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;width:auto;display:inline-block}
.btn.bad{background:#3b1816;color:var(--bad)}
.btn:disabled{opacity:.5}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#2a2210,#1b1b1b)}
.gallery img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
label{display:block;margin:12px 0 6px;font-size:14px;color:var(--mute)}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;font-family:inherit}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:10px 0;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px}
.slot.sel{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.slot.dis{opacity:.3;pointer-events:none;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px}
.chip.sel{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
iframe{width:100%;height:240px;border:0;border-radius:14px;filter:grayscale(.3)}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st-bekliyor{background:#3b2f10;color:var(--gold)}.st-iptal{background:#3b1816;color:var(--bad)}.st-onay{background:#143b22;color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0c0c0cf2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 0 8px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.active{color:var(--gold)}
#install{display:none;margin:12px 0}
.toast{position:fixed;left:16px;right:16px;bottom:96px;background:var(--gold);color:#111;padding:14px;border-radius:12px;font-weight:700;text-align:center;display:none;z-index:20}
.notice{padding:12px;border-radius:12px;font-size:14px;margin-bottom:12px;line-height:1.5;background:#3b1816;color:var(--bad)}
</style>
</head>
<body>

<header class="hero">
  <img id="heroImg" src="images/kapak.jpg" alt="" onerror="this.style.display='none'">
  <div class="in wrap">
    <div class="stars">★ ★</div>
    <h1 id="shopName">İki Yıldız</h1>
    <p>Erkek Kuaförü</p>
    <div><span id="openBadge" class="badge"></span></div>
  </div>
</header>

<main class="wrap">

  <section id="home" class="active">
    <h2>Hoş geldiniz</h2>
    <p class="mute" id="about"></p>
    <div class="btns">
      <button class="btn" data-act="go" data-id="book">Randevu Al</button>
      <a class="btn alt" id="callBtn">Hemen Ara</a>
    </div>
    <button class="btn alt" id="install">📲 Uygulamayı telefona ekle</button>
    <h2 style="margin-top:20px">Hizmetler</h2>
    <div id="services"></div>
    <div id="galWrap"><h2 style="margin-top:20px">Galeri</h2>
    <div class="gallery" id="gallery"></div></div>
  </section>

  <section id="book">
    <h2>Randevu Al</h2>
    <div class="notice" id="offline" style="display:none"></div>
    <form id="form" autocomplete="on">
      <label>Hizmet</label>
      <div class="chips" id="svcChips"></div>
      <label for="date">Tarih</label>
      <input type="date" id="date" required>
      <label>Saat (dolu saatler üstü çizili görünür)</label>
      <div class="slots" id="slots"></div>
      <p class="mute" id="slotInfo"></p>
      <label for="name">Ad Soyad</label>
      <input id="name" name="name" required minlength="2" maxlength="60" autocomplete="name">
      <label for="phone">Cep telefonu</label>
      <input id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="05XX XXX XX XX">
      <label for="note">Not (isteğe bağlı)</label>
      <textarea id="note" rows="2" maxlength="200"></textarea>
      <button class="btn" id="bookBtn" style="margin-top:16px" type="submit">Randevu Talebini Gönder</button>
      <p class="mute">Talebiniz kuaföre anında iletilir. Onaylandığında "Randevularım" sayfasında görünür.</p>
    </form>
  </section>

  <section id="mine">
    <h2>Randevularım</h2>
    <div id="list"></div>
  </section>

  <section id="contact">
    <h2>Adres ve Konum</h2>
    <div class="card"><div id="addr"></div></div>
    <iframe id="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Harita"></iframe>
    <div class="btns">
      <a class="btn" id="dirBtn" target="_blank" rel="noopener">Yol Tarifi</a>
      <a class="btn alt" id="waBtn" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <a class="btn alt" id="callBtn2" style="margin-bottom:12px">📞 Ara</a>
    <h2 style="margin-top:16px">Çalışma Saatleri</h2>
    <div class="card" id="hours"></div>
  </section>

</main>

<nav>
  <button class="active" data-act="go" data-id="home"><span>🏠</span>Ana Sayfa</button>
  <button data-act="go" data-id="book"><span>✂️</span>Randevu</button>
  <button data-act="go" data-id="mine"><span>📋</span>Randevularım</button>
  <button data-act="go" data-id="contact"><span>📍</span>İletişim</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const DEF={
  name:"İki Yıldız",hero:"",
  about:"İki Yıldız Erkek Kuaförü'nde saç kesimi, sakal tasarımı ve bakım hizmetleri. Online randevu ile sırada beklemeden hizmet alın.",
  phone:"05XX XXX XX XX",whatsapp:"905XXXXXXXXX",
  address:"Örnek Mah. Örnek Cad. No:1, İstanbul",mapQuery:"Örnek Mah. Örnek Cad. No:1, İstanbul",
  hours:{0:null,1:[10,20],2:[10,20],3:[10,20],4:[10,20],5:[10,20],6:[10,20]},
  services:[{name:"Saç Kesimi",price:"250 ₺",min:30},{name:"Sakal Tıraşı",price:"150 ₺",min:30},{name:"Saç + Sakal",price:"350 ₺",min:60}],
  gallery:[],ntfyTopic:"",repo:"",pubKey:null
};
const STEP=30;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=d=>new Date(d+"T00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"});
const lsGet=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let SHOP=JSON.parse(JSON.stringify(DEF)),selSvc="",selTime=null,STATE={taken:{},status:{}},stateAt=0;

function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
function go(id){
  $$("section").forEach(s=>s.classList.toggle("active",s.id===id));
  $$("nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(id==="mine")renderList();
  if(id==="book")refreshState().then(renderSlots);
  scrollTo(0,0);
}

/* GitHub deposu (adresten otomatik bulunur) */
function repoInfo(){
  if(SHOP.repo&&SHOP.repo.includes("/")){const [o,r]=SHOP.repo.split("/");return{o,r}}
  const h=location.hostname,p=location.pathname.split("/").filter(Boolean);
  if(!h.endsWith(".github.io"))return null;
  return{o:h.split(".")[0],r:(p[0]&&!p[0].includes("."))?p[0]:h};
}
async function refreshState(force){
  if(!force&&Date.now()-stateAt<15000)return;
  const ri=repoInfo(),tries=[];
  if(ri)tries.push(()=>fetch(`https://api.github.com/repos/${ri.o}/${ri.r}/contents/data/state.json`,{headers:{Accept:"application/vnd.github.raw+json"},cache:"no-store"}));
  tries.push(()=>fetch("data/state.json?t="+Date.now(),{cache:"no-store"}));
  for(const t of tries){
    try{const r=await t();if(r.ok){const j=await r.json();STATE={taken:j.taken||{},status:j.status||{}};stateAt=Date.now();return}}catch(e){}
  }
}

function init(){
  selSvc=(SHOP.services.find(s=>s.name===selSvc)||SHOP.services[0]||{}).name||"";
  $("#shopName").textContent=SHOP.name;document.title=SHOP.name+" Erkek Kuaförü";
  const hi=$("#heroImg");hi.style.display="";hi.src=SHOP.hero||SHOP.heroImage||"images/kapak.jpg";
  $("#about").textContent=SHOP.about;
  const tel="tel:"+String(SHOP.phone).replace(/\s/g,"");
  $("#callBtn").href=tel;$("#callBtn").textContent="📞 "+SHOP.phone;
  $("#callBtn2").href=tel;$("#callBtn2").textContent="📞 "+SHOP.phone;
  $("#services").innerHTML=SHOP.services.map(s=>`<div class="card row"><div><b>${esc(s.name)}</b><div class="mute">${esc(s.min)} dk</div></div><div class="price">${esc(s.price)}</div></div>`).join("");
  $("#svcChips").innerHTML=SHOP.services.map(s=>`<div class="chip${s.name===selSvc?" sel":""}" data-act="svc" data-n="${esc(s.name)}">${esc(s.name)}</div>`).join("");
  $("#addr").textContent="📍 "+SHOP.address;
  $("#map").src="https://maps.google.com/maps?q="+encodeURIComponent(SHOP.mapQuery)+"&output=embed";
  $("#dirBtn").href="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(SHOP.mapQuery);
  $("#waBtn").href="https://wa.me/"+String(SHOP.whatsapp).replace(/\D/g,"");
  $("#hours").innerHTML=[1,2,3,4,5,6,0].map(d=>{const h=SHOP.hours[d];return `<div class="row" style="padding:4px 0"><span>${DAYS[d]}</span><span class="${h?"":"mute"}">${h?pad(h[0])+":00 - "+pad(h[1])+":00":"Kapalı"}</span></div>`}).join("");
  const g=(SHOP.gallery||[]);
  $("#gallery").innerHTML=g.map(p=>`<div><img src="${esc(p)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>`).join("");
  $("#galWrap").style.display=g.length?"":"none";
  const o=$("#offline");
  if(!SHOP.ntfyTopic){o.textContent="Online randevu sistemi henüz kurulmadı. Lütfen telefonla arayın.";o.style.display="block"}else o.style.display="none";
  const d=$("#date");d.min=iso(new Date());if(!d.value)d.value=iso(new Date());
  renderSlots();openBadge();
}
function openBadge(){
  const n=new Date(),h=SHOP.hours[n.getDay()],b=$("#openBadge"),x=n.getHours()+n.getMinutes()/60;
  const open=h&&x>=h[0]&&x<h[1];
  b.textContent=open?"● Şu an açık":"● Şu an kapalı";b.className="badge "+(open?"open":"closed");
}
function slotTimes(dv){
  const h=SHOP.hours[new Date(dv+"T00:00").getDay()];if(!h)return[];
  const a=[];for(let m=h[0]*60;m<h[1]*60;m+=STEP)a.push(pad(Math.floor(m/60))+":"+pad(m%60));return a;
}
const curSvc=()=>SHOP.services.find(x=>x.name===selSvc)||SHOP.services[0]||{min:30};
const needSlots=()=>Math.max(1,Math.ceil((+curSvc().min||30)/STEP));

function renderSlots(){
  selTime=null;
  const dv=$("#date").value;if(!dv)return;
  const box=$("#slots"),info=$("#slotInfo"),times=slotTimes(dv);
  if(!times.length){box.innerHTML="";info.textContent="Bu gün kapalıyız, lütfen başka bir gün seçin.";return}
  info.textContent="";
  const now=new Date(),n=needSlots();let html="";
  times.forEach((t,i)=>{
    let ok=i+n<=times.length;
    for(let j=i;ok&&j<i+n;j++){
      const [hh,mm]=times[j].split(":").map(Number);
      const past=iso(now)===dv&&hh*60+mm<=now.getHours()*60+now.getMinutes();
      if(STATE.taken[dv+"_"+times[j]]||past)ok=false;
    }
    html+=`<div class="slot${ok?"":" dis"}" data-act="slot" data-t="${t}">${t}</div>`;
  });
  box.innerHTML=html;
}
function normPhone(v){
  let d=String(v).replace(/\D/g,"");
  if(d.startsWith("90")&&d.length===12)d="0"+d.slice(2);
  if(d.length===10&&d[0]==="5")d="0"+d;
  return /^05\d{9}$/.test(d)?d:null;
}
const clean=s=>String(s).replace(/[\r\n|]+/g," ").trim();
const getMine=()=>lsGet("iy_my",[]);

async function ntfy(title,message){
  const click=new URL("admin.html",location.href).href;
  const r=await fetch("https://ntfy.sh/"+SHOP.ntfyTopic+"?priority=4&tags=scissors&title="+encodeURIComponent(title)+"&click="+encodeURIComponent(click),{method:"POST",body:message});
  if(!r.ok)throw new Error("ntfy "+r.status);
}

/* Talepler yöneticinin açık anahtarıyla şifrelenir: ntfy konusunu bulan biri ad/telefon okuyamaz */
const toB=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function encPayload(obj){
  const pk=await crypto.subtle.importKey("jwk",SHOP.pubKey,{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]);
  const aes=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},aes,new TextEncoder().encode(JSON.stringify(obj)));
  const wk=await crypto.subtle.encrypt({name:"RSA-OAEP"},pk,await crypto.subtle.exportKey("raw",aes));
  return btoa(JSON.stringify({k:toB(wk),iv:toB(iv),ct:toB(ct)}));
}
async function sendReq(cancel,p){
  if(SHOP.pubKey&&window.crypto&&crypto.subtle){
    const t=cancel?"İptal talebi":"Yeni randevu talebi";
    await ntfy(t,t+" geldi. Ayrıntılar için yönetici uygulamasını açın.\nENC:"+await encPayload({...p,cancel}));
    return;
  }
  // eski yöntem (yönetici uygulaması henüz anahtar üretmediyse)
  const msg=[cancel?"İPTAL TALEBİ":"YENİ RANDEVU TALEBİ","Hizmet: "+p.svc,"Tarih: "+fmtDate(p.date)+" · "+p.time,"Ad: "+p.name,"Tel: "+p.phone,p.note?"Not: "+p.note:"","Kod: "+[p.id,p.date,p.time,p.n,p.min].join("|")].filter(Boolean).join("\n");
  await ntfy((cancel?"İptal talebi: ":"Yeni randevu: ")+p.name,msg);
}

async function submitBooking(e){
  e.preventDefault();
  if(!SHOP.ntfyTopic){toast("Online randevu şu an kapalı, lütfen arayın.");return}
  if(!selTime){toast("Lütfen bir saat seçin");return}
  const phone=normPhone($("#phone").value);if(!phone){toast("Geçerli bir cep telefonu girin (05XX XXX XX XX)");return}
  const name=clean($("#name").value);if(name.length<2){toast("Adınızı yazın");return}
  const dv=$("#date").value,svc=curSvc(),n=needSlots(),note=clean($("#note").value);
  const btn=$("#bookBtn");btn.disabled=true;btn.textContent="Gönderiliyor...";
  try{
    await refreshState(true);
    const times=slotTimes(dv),i=times.indexOf(selTime);
    for(let j=i;j<i+n;j++)if(STATE.taken[dv+"_"+times[j]]){toast("Bu saat az önce doldu, başka saat seçin.");renderSlots();return}
    const id=Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
    await sendReq(false,{id,date:dv,time:selTime,n,min:+svc.min||30,svc:svc.name,name,phone,note});
    lsSet("iy_my",[{id,svc:svc.name,date:dv,time:selTime,n,name,phone,ts:Date.now()},...getMine()].slice(0,40));
    $("#form").reset();$("#date").value=iso(new Date());
    toast("Talebiniz iletildi! Onaylanınca durumu burada görünür.");go("mine");
  }catch(err){console.error(err);toast("Gönderilemedi, lütfen internetinizi kontrol edin veya arayın.")}
  finally{btn.disabled=false;btn.textContent="Randevu Talebini Gönder"}
}

async function renderList(){
  const box=$("#list"),list=getMine();
  if(!list.length){box.innerHTML=`<p class="mute">Henüz randevunuz yok.</p><button class="btn" data-act="go" data-id="book">Randevu Al</button>`;return}
  await refreshState();
  box.innerHTML=list.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(r=>{
    const s=(STATE.status[r.id]||{}).s;
    let lb="Onay bekliyor",cl="st-bekliyor",can=true;
    if(s==="onaylandi"){lb="Onaylandı";cl="st-onay"}
    if(s==="iptal"){lb="İptal edildi";cl="st-iptal";can=false}
    if(r.cancelReq&&s!=="iptal"){lb="İptal talebi gönderildi";can=false}
    return `<div class="card"><div class="row"><b>${esc(r.svc)}</b><span class="status ${cl}">${lb}</span></div>
    <div class="mute" style="margin:6px 0">📅 ${fmtDate(r.date)} · 🕐 ${esc(r.time)}</div>
    ${can?`<button class="btn bad small" data-act="cancelReq" data-id="${esc(r.id)}">İptal talebi gönder</button>`:""}</div>`}).join("");
}

const ACT={
  go:d=>go(d.id),
  svc:(d,el)=>{selSvc=d.n;$$("#svcChips .chip").forEach(c=>c.classList.toggle("sel",c===el));renderSlots()},
  slot:(d,el)=>{$$("#slots .slot").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");selTime=d.t},
  cancelReq:async d=>{
    if(!confirm("İptal talebi kuaföre iletilsin mi?"))return;
    const l=getMine(),r=l.find(x=>x.id===d.id);if(!r)return;
    try{
      await sendReq(true,{id:r.id,date:r.date,time:r.time,n:r.n||1,min:30,svc:r.svc,name:r.name,phone:r.phone,note:""});
      r.cancelReq=true;lsSet("iy_my",l);toast("İptal talebiniz iletildi");renderList();
    }catch(e){toast("Gönderilemedi, lütfen arayın")}
  }
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=ACT[el.dataset.act];if(f)f(el.dataset,el)});
$("#date").addEventListener("change",renderSlots);
$("#form").addEventListener("submit",submitBooking);

let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("#install").style.display="block"});
$("#install").onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$("#install").style.display="none"}};
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));

init();
fetch("config.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():{}).catch(()=>({}))
  .then(c=>{SHOP=Object.assign(SHOP,c);init();refreshState(true).then(renderSlots)});
</script>
</body>
</html>
